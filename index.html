<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>വിദ്യാരംഭം — അരിയിൽ സ്വയം എഴുതാം</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Malayalam:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:#f4d18a;font-family:'Noto Serif Malayalam',serif;background:radial-gradient(circle at top,#49200e,#210d06 55%,#100604)}
.container{width:100%;max-width:680px;text-align:center}
h1{font-size:clamp(22px,5vw,36px);color:#f2bd55;margin:0 0 8px}
.subtitle{color:#c9a775;margin:0 0 25px;font-size:14px}
.plate{width:min(88vw,520px);aspect-ratio:1;margin:auto;border-radius:50%;padding:27px;background:linear-gradient(135deg,#77787a,#252629 45%,#111214 65%,#d7a33c 70%,#734313 76%,#27201a 82%);box-shadow:0 25px 45px #0009,inset 0 3px 7px #ffffff30}
.rice-area{width:100%;height:100%;position:relative;overflow:hidden;border-radius:50%;background:radial-gradient(circle,#eee1c5,#d5c19a);box-shadow:inset 0 0 18px #70502c88}
#riceCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.instruction,.reveal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;line-height:1.8;font-size:clamp(20px,5vw,32px);font-weight:700}
.instruction{color:#806039;opacity:.3}
.reveal{color:#795329;opacity:0;transition:opacity 1s;text-shadow:0 1px 1px #fff6}
.reveal.show{opacity:.95}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:22px}
button{border:1px solid #d6a23e;background:#35190c;color:#f5d18b;border-radius:30px;padding:11px 18px;font:600 14px 'Noto Serif Malayalam',serif;cursor:pointer;transition:.2s}
button:hover{background:#63300f;transform:translateY(-2px)}
button:disabled{opacity:.55;cursor:wait;transform:none}
#status{min-height:28px;margin-top:14px;color:#d0b48a;font-size:13px}
@media(max-width:480px){.plate{padding:18px}}
</style>
</head>
<body>
<main class="container">
  <h1>ഓം ഹരിശ്രീ ഗണപതയേ നമഃ</h1>
  <p class="subtitle">വിദ്യാരംഭം • വിജയദശമി</p>
  <div class="plate">
    <div class="rice-area" id="riceArea">
      <canvas id="riceCanvas"></canvas>
      <div class="instruction" id="instruction">
        <div>ഓം</div><div>ഹരിശ്രീ</div><div>ഗണപതയേ നമഃ</div>
      </div>
      <div class="reveal" id="reveal">
        <div>ഓം</div><div>ഹരിശ്രീ</div><div>ഗണപതയേ നമഃ</div>
      </div>
    </div>
  </div>
  <p>മൗസ് / വിരൽ ഉപയോഗിച്ച് എഴുതുക, അല്ലെങ്കിൽ സ്വയം എഴുതിക്കുക ✍</p>
  <div class="controls">
    <button id="autoWrite">✨ സ്വയം എഴുതുക</button>
    <button id="showText">വാചകം കാണിക്കുക</button>
    <button id="reset">വീണ്ടും എഴുതുക</button>
  </div>
  <div id="status">“സ്വയം എഴുതുക” അമർത്തിയാൽ വാചകം അരിയിൽ സ്വയം എഴുതപ്പെടും.</div>
</main>
<script>
const canvas=document.getElementById('riceCanvas');
const ctx=canvas.getContext('2d');
const area=document.getElementById('riceArea');
const reveal=document.getElementById('reveal');
const instruction=document.getElementById('instruction');
const statusEl=document.getElementById('status');
const autoBtn=document.getElementById('autoWrite');
let drawing=false,lastPoint=null,seed=12345,animationId=0;

function random(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}
function resizeCanvas(){
  const rect=area.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);drawRice();
}
function drawRice(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  ctx.clearRect(0,0,w,h);seed=12345;
  const count=Math.floor(w*h/20);
  for(let i=0;i<count;i++){
    const x=random()*w,y=random()*h,len=3+random()*5,angle=random()*Math.PI;
    ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.lineWidth=1.3;ctx.lineCap='round';
    ctx.strokeStyle=random()>.5?'rgba(255,249,228,.75)':'rgba(145,111,66,.3)';
    ctx.beginPath();ctx.moveTo(-len/2,0);ctx.quadraticCurveTo(0,-1.4,len/2,0);ctx.stroke();ctx.restore();
  }
}
function getPosition(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function scratch(p){
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  if(lastPoint){
    ctx.strokeStyle='rgba(105,72,36,.85)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(lastPoint.x,lastPoint.y);ctx.lineTo(p.x,p.y);ctx.stroke();
    ctx.strokeStyle='rgba(255,245,216,.8)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(lastPoint.x-1,lastPoint.y-1);ctx.lineTo(p.x-1,p.y-1);ctx.stroke();
  }else{ctx.fillStyle='rgba(105,72,36,.8)';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}
  ctx.restore();lastPoint=p;
}
canvas.addEventListener('pointerdown',e=>{
  cancelAnimationFrame(animationId);drawing=true;lastPoint=null;
  canvas.setPointerCapture(e.pointerId);reveal.classList.remove('show');instruction.style.opacity='.06';
  scratch(getPosition(e));statusEl.textContent='അരിയിൽ എഴുതുന്നു...';
});
canvas.addEventListener('pointermove',e=>{if(drawing)scratch(getPosition(e))});
function stopWriting(){drawing=false;lastPoint=null}
canvas.addEventListener('pointerup',stopWriting);canvas.addEventListener('pointercancel',stopWriting);

/* Auto-write: reveal the Malayalam inscription progressively, like a stylus writing in rice. */
async function autoWrite(){
  cancelAnimationFrame(animationId);drawing=false;lastPoint=null;
  autoBtn.disabled=true;
  reveal.classList.remove('show');instruction.style.opacity='.04';
  resizeCanvas();
  statusEl.textContent='ചോക്ക് അരിയിൽ എഴുതുന്നു...';
  await document.fonts.ready;
  const w=canvas.clientWidth,h=canvas.clientHeight;
  const off=document.createElement('canvas');off.width=canvas.width;off.height=canvas.height;
  const o=off.getContext('2d');
  const dpr=canvas.width/w;o.setTransform(dpr,0,0,dpr,0,0);
  const lines=['ഓം','ഹരിശ്രീ','ഗണപതയേ നമഃ'];
  const fontSize=Math.min(w*.105,34);
  o.textAlign='center';o.textBaseline='middle';
  o.font=`700 ${fontSize}px "Noto Serif Malayalam", serif`;
  const lineGap=fontSize*1.65;
  const startY=h/2-lineGap;
  // Text is drawn into an offscreen layer; a moving reveal simulates writing.
  o.fillStyle='rgba(105,72,36,.88)';
  lines.forEach((line,i)=>o.fillText(line,w/2,startY+i*lineGap));
  const totalFrames=105;let frame=0;
  function animate(){
    const progress=Math.min(frame/totalFrames,1);
    // Keep rice visible, then reveal the writing layer from left to right.
    drawRice();
    ctx.save();
    ctx.beginPath();ctx.rect(0,0,w*progress,h);ctx.clip();
    ctx.drawImage(off,0,0,off.width,off.height,0,0,w,h);
    // Small pale highlight gives the grooves a rice/chalk impression.
    ctx.globalAlpha=.5;
    ctx.drawImage(off,0,0,off.width,off.height,1,1,w,h);
    ctx.restore();
    frame++;
    if(progress<1){animationId=requestAnimationFrame(animate)}
    else{
      statusEl.textContent='ഓം ഹരിശ്രീ ഗണപതയേ നമഃ 🙏';
      autoBtn.disabled=false;
    }
  }
  animate();
}
autoBtn.addEventListener('click',autoWrite);
document.getElementById('showText').addEventListener('click',()=>{
  cancelAnimationFrame(animationId);autoBtn.disabled=false;
  instruction.style.opacity='.05';reveal.classList.add('show');
  statusEl.textContent='ഓം ഹരിശ്രീ ഗണപതയേ നമഃ 🙏';
});
document.getElementById('reset').addEventListener('click',()=>{
  cancelAnimationFrame(animationId);autoBtn.disabled=false;reveal.classList.remove('show');
  instruction.style.opacity='.3';resizeCanvas();
  statusEl.textContent='തളിക ഒരുക്കി. വീണ്ടും എഴുതാം.';
});
if('ResizeObserver'in window)new ResizeObserver(resizeCanvas).observe(area);
else window.addEventListener('resize',resizeCanvas);
resizeCanvas();
</script>
</body>
</html>
