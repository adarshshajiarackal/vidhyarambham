
<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidyarambham Rice Writing</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Malayalam:wght@400;600;700&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #f4d18a;
  font-family: 'Noto Serif Malayalam', serif;
  background: radial-gradient(
    circle at top,
    #49200e,
    #210d06 55%,
    #100604
  );
}

.container {
  width: 100%;
  max-width: 650px;
  text-align: center;
}

h1 {
  font-size: clamp(22px, 5vw, 36px);
  color: #f2bd55;
  margin-bottom: 8px;
}

.subtitle {
  color: #c9a775;
  margin-bottom: 25px;
  font-size: 14px;
}

/* Rice plate */
.plate {
  width: min(88vw, 520px);
  aspect-ratio: 1;
  margin: auto;
  border-radius: 50%;
  padding: 27px;
  background: linear-gradient(
    135deg,
    #77787a,
    #252629 45%,
    #111214 65%,
    #d7a33c 70%,
    #734313 76%,
    #27201a 82%
  );
  box-shadow:
    0 25px 45px #0009,
    inset 0 3px 7px #ffffff30;
}

.rice-area {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
  border-radius: 50%;
  background:
    radial-gradient(circle, #eee1c5, #d5c19a);
  box-shadow: inset 0 0 18px #70502c88;
}

#riceCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: crosshair;
}

.instruction {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  pointer-events: none;
  color: #806039;
  opacity: .35;
  font-size: clamp(22px, 5vw, 34px);
  line-height: 1.8;
  font-weight: 700;
}

.reveal {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  pointer-events: none;
  color: #795329;
  font-size: clamp(22px, 5vw, 34px);
  font-weight: 700;
  line-height: 1.8;
  opacity: 0;
  transition: opacity 1.5s ease;
  text-shadow: 0 1px 1px #fff6;
}

.reveal.show {
  opacity: .95;
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 22px;
}

button {
  border: 1px solid #d6a23e;
  background: #35190c;
  color: #f5d18b;
  border-radius: 30px;
  padding: 12px 20px;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
  transition: .25s;
}

button:hover {
  background: #63300f;
  transform: translateY(-2px);
}

#status {
  min-height: 28px;
  margin-top: 14px;
  color: #d0b48a;
  font-size: 13px;
}

@media(max-width: 480px) {
  .plate {
    padding: 18px;
  }
}
</style>
</head>

<body>
<div class="container">

  <h1>ഓം ഹരിശ്രീ ഗണപതയേ നമഃ</h1>
  <div class="subtitle">
    വിദ്യാരംഭം • വിജയദശമി
  </div>

  <div class="plate">
    <div class="rice-area" id="riceArea">

      <canvas id="riceCanvas"></canvas>

      <div class="instruction" id="instruction">
        <div>ഓം</div>
        <div>ഹരിശ്രീ</div>
        <div>ഗണപതയേ നമഃ</div>
      </div>

      <div class="reveal" id="reveal">
        <div>ഓം</div>
        <div>ഹരിശ്രീ</div>
        <div>ഗണപതയേ നമഃ</div>
      </div>

    </div>
  </div>

  <p>മൗസ് അല്ലെങ്കിൽ വിരൽ ഉപയോഗിച്ച് അരിയിൽ എഴുതുക ✍</p>

  <div class="controls">
    <button id="showText">എഴുത്ത് കാണിക്കുക</button>
    <button id="reset">വീണ്ടും എഴുതുക</button>
  </div>

  <div id="status">
    അരിയിൽ അമർത്തി വലിച്ചുകൊണ്ട് എഴുതാം.
  </div>

</div>

<script>
const canvas = document.getElementById("riceCanvas");
const ctx = canvas.getContext("2d");

const area = document.getElementById("riceArea");
const reveal = document.getElementById("reveal");
const instruction = document.getElementById("instruction");
const status = document.getElementById("status");

let drawing = false;
let lastPoint = null;
let seed = 12345;

/* Consistent random grain placement */
function random() {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}

/* Resize canvas for desktop and mobile */
function resizeCanvas() {
  const rect = area.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawRice();
}

/* Draw realistic rice grains */
function drawRice() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;

  ctx.clearRect(0, 0, w, h);
  seed = 12345;

  const count = Math.floor(w * h / 20);

  for (let i = 0; i < count; i++) {
    const x = random() * w;
    const y = random() * h;
    const length = 3 + random() * 5;
    const angle = random() * Math.PI;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    ctx.lineWidth = 1.3;
    ctx.lineCap = "round";

    ctx.strokeStyle = random() > 0.5
      ? "rgba(255,249,228,.75)"
      : "rgba(145,111,66,.3)";

    ctx.beginPath();
    ctx.moveTo(-length / 2, 0);
    ctx.quadraticCurveTo(0, -1.4, length / 2, 0);
    ctx.stroke();

    ctx.restore();
  }
}

/* Get pointer position */
function getPosition(event) {
  const rect = canvas.getBoundingClientRect();

  return {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  };
}

/* Scratch the rice like a writing stylus */
function scratch(point) {
  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  if (lastPoint) {
    // Dark furrow in the rice
    ctx.strokeStyle = "rgba(105,72,36,.85)";
    ctx.lineWidth = 6;

    ctx.beginPath();
    ctx.moveTo(lastPoint.x, lastPoint.y);
    ctx.lineTo(point.x, point.y);
    ctx.stroke();

    // Fine highlight along the furrow
    ctx.strokeStyle = "rgba(255,245,216,.8)";
    ctx.lineWidth = 1.5;

    ctx.beginPath();
    ctx.moveTo(lastPoint.x - 1, lastPoint.y - 1);
    ctx.lineTo(point.x - 1, point.y - 1);
    ctx.stroke();
  } else {
    ctx.fillStyle = "rgba(105,72,36,.8)";
    ctx.beginPath();
    ctx.arc(point.x, point.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
  lastPoint = point;
}

/* Start writing */
canvas.addEventListener("pointerdown", event => {
  drawing = true;
  lastPoint = null;

  canvas.setPointerCapture(event.pointerId);

  reveal.classList.remove("show");
  instruction.style.opacity = ".08";

  scratch(getPosition(event));
  status.textContent = "അരിയിൽ എഴുതി തുടങ്ങൂ...";
});

/* Continue writing */
canvas.addEventListener("pointermove", event => {
  if (!drawing) return;
  scratch(getPosition(event));
});

/* Stop writing */
function stopWriting() {
  drawing = false;
  lastPoint = null;
}

canvas.addEventListener("pointerup", stopWriting);
canvas.addEventListener("pointercancel", stopWriting);

/* Reveal Malayalam inscription */
document.getElementById("showText").addEventListener("click", () => {
  reveal.classList.remove("show");
  instruction.style.opacity = ".08";

  setTimeout(() => {
    reveal.classList.add("show");
  }, 100);

  status.textContent = "ഓം ഹരിശ്രീ ഗണപതയേ നമഃ 🙏";
});

/* Reset the plate */
document.getElementById("reset").addEventListener("click", () => {
  reveal.classList.remove("show");
  instruction.style.opacity = ".35";

  resizeCanvas();

  status.textContent = "തളിക ഒരുക്കി. വീണ്ടും എഴുതാം.";
});

if ("ResizeObserver" in window) {
  new ResizeObserver(resizeCanvas).observe(area);
} else {
  window.addEventListener("resize", resizeCanvas);
}

resizeCanvas();
</script>
</body>
</html>
